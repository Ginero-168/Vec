<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Diagram Interactive Demo</title>
    <link rel="stylesheet" href="../extension/css/color-diagram.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #ffffff;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        width: 900px;
        height: 900px;
        overflow: hidden;
      }
      .left-pane {
        width: 380px;
        height: 900px;
        background-color: #0f1522;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .panel-header-title {
        padding: 14px 16px 6px;
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.3px;
      }
      .right-pane {
        flex: 1;
        height: 900px;
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 140px;
        position: relative;
        background-image: 
          linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
          linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
          linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }
      .preview-title {
        position: absolute;
        top: 18px;
        font-size: 14px;
        font-weight: 500;
        color: #475569;
      }
      .preview-box {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 4px;
        overflow: hidden;
        background: #0f172a;
      }
      #preview-canvas {
        display: block;
        width: 480px;
        height: 180px;
        image-rendering: pixelated;
      }
      .preview-dim-caption {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
        background: rgba(255, 255, 255, 0.85);
        padding: 4px 10px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div class="left-pane">
      <div class="panel-header-title">Palette</div>
      <div id="diagram-container"></div>
    </div>
    <div class="right-pane">
      <div class="preview-title">Palette Preview</div>
      <div class="preview-box">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="preview-dim-caption">
        Selected color <strong>#e29434</strong> highlighted &middot; other colors dimmed
      </div>
    </div>
    <script src="color-diagram-demo.js"></script>
  </body>
</html>
