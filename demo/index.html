<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vector Panel · แก้สี</title>
    <link rel="stylesheet" href="../extension/style.css" />
    <style>
      body { min-height: 100vh; background: #161618; }
      .desk { max-width: 400px; margin: 0 auto; padding: 24px 0 48px; }
      .desk .panel { background: #252528; min-height: auto; }
      .compare { max-width: 1100px; margin: 0 auto 48px; padding: 0 16px; color: #f4f1ea; }
      .compare h2 { font-size: 16px; margin: 0 0 8px; }
      .compare p { color: #b9b4c7; font-size: 13px; }
      .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .compare figure { margin: 0; }
      .compare figcaption { font-size: 12px; margin-bottom: 6px; color: #d9d3e6; }
      .compare img { width: 100%; height: auto; background: #111; border-radius: 8px; }
      .compare .clean-controls { max-width: 360px; margin: 8px 0 14px; }
    </style>
  </head>
  <body>
    <div class="desk">
      <main class="panel">
        <header class="panel-header">
          <div class="mark">V</div>
          <div>
            <h1>Vector Panel</h1>
            <p>แก้สีบนแผนที่พิกเซล ก่อนทำเส้นให้เรียบ</p>
          </div>
        </header>
        <section class="section" aria-labelledby="sample-title">
          <div class="section-heading">
            <h2 id="sample-title">ภาพตัวอย่าง</h2>
            <span id="phase" class="phase">แก้สี</span>
          </div>
          <p class="editor-lead">ลายลูกโป่งจำลอง มีจุดส้มอ่อนและเส้นขอบบางให้ลอง Zap หน้านี้ใช้ตัวแก้สีชุดเดียวกับ Panel ใน Illustrator</p>
        </section>
        <div id="editor-root"></div>
        <section class="section" aria-labelledby="preview-title">
          <h2 id="preview-title">เส้นจากสีที่แก้</h2>
          <div class="preview-frame">
            <img id="preview" alt="ตัวอย่างเวกเตอร์จากแผนที่สีที่แก้" hidden />
            <p id="preview-empty">กดดูเส้นเพื่อเห็นสีที่จะส่งเข้าตัวทำเส้น</p>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>
    <section class="compare" aria-labelledby="compare-title">
      <h2 id="compare-title">ภาพจาก Illustrator</h2>
      <div class="clean-controls">
        <label class="check-row" for="clean-shapes">
          <input id="clean-shapes" type="checkbox" />
          ทำให้เป็นรูปทรงเรียบ
        </label>
        <div class="field-row">
          <label for="clean-strength">ความแรงของรูปทรง</label>
          <output id="clean-strength-value" for="clean-strength">40</output>
        </div>
        <input id="clean-strength" type="range" min="1" max="100" value="40" disabled />
        <label class="check-row" for="clean-text">
          <input id="clean-text" type="checkbox" disabled />
          รวมตัวอักษร
        </label>
      </div>
      <p id="compare-status">รอผลแยกสี</p>
      <div class="compare-grid">
        <figure>
          <figcaption>ต้นฉบับ</figcaption>
          <img id="compare-original" alt="ภาพต้นฉบับจากหน้าจอ" src="../fixtures/user-test-original.png" hidden />
        </figure>
        <figure>
          <figcaption>เส้นใหม่</figcaption>
          <img id="compare-result" alt="ผลเวกเตอร์จากภาพต้นฉบับ" hidden />
        </figure>
      </div>
    </section>
    <script src="editor.js"></script>
  </body>
</html>
